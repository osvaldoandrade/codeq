# Example codeQ Configuration with Persistence Plugin

# Core settings
port: 8080
env: production
timezone: America/Sao_Paulo
logLevel: info
logFormat: json

# CodeQ persists on Pebble. persistenceProvider must be pebble.
persistenceProvider: pebble
persistenceConfig:
  path: /var/lib/codeq/pebble

# === Authentication ===
# Producer authentication (for task submission)
producerAuthProvider: static
producerAuthConfig:
  token: "your-producer-token-here"
  subject: "api-client"

# Worker authentication (for task claiming)
workerAuthProvider: static
workerAuthConfig:
  token: "your-worker-token-here"
  subject: "worker-1"
  scopes: ["codeq:claim", "codeq:heartbeat", "codeq:abandon", "codeq:nack", "codeq:result", "codeq:subscribe"]
  eventTypes: ["GENERATE_MASTER", "GENERATE_CREATIVE"]

# Optional worker streaming gRPC listener. When set, workers can use a
# long-lived bidirectional stream instead of the HTTP claim/result hot path.
# workerStreamAddr: ":9091"

# === Task Scheduling ===
defaultLeaseSeconds: 300
requeueInspectLimit: 200
maxAttemptsDefault: 5

# === Backoff Configuration ===
backoffPolicy: exp_full_jitter
backoffBaseSeconds: 5
backoffMaxSeconds: 900

# === Webhooks ===
webhookHmacSecret: "your-webhook-secret"
subscriptionMinIntervalSeconds: 1
subscriptionCleanupIntervalSeconds: 300

# Result webhooks
resultWebhookMaxAttempts: 5
resultWebhookBaseBackoffSeconds: 5
resultWebhookMaxBackoffSeconds: 300

# === Rate Limiting ===
rateLimit:
  producer:
    requestsPerMinute: 1000
    burstSize: 100
  worker:
    requestsPerMinute: 500
    burstSize: 50
  webhook:
    requestsPerMinute: 100
    burstSize: 10
  admin:
    requestsPerMinute: 100
    burstSize: 10

# === Storage ===
localArtifactsDir: /tmp/codeq-artifacts

# === Tracing (Optional) ===
tracingEnabled: false
tracingServiceName: codeq
tracingOtlpEndpoint: localhost:4317
tracingOtlpInsecure: true
tracingSampleRatio: 1.0
